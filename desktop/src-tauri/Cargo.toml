[package]
name = "iot-guardian"
version = "1.0.4"
description = "IoT Guardian: μάθε IoT και ασφάλεια, ως εφαρμογή υπολογιστή"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# Το ίδιο πρόγραμμα ως βιβλιοθήκη: το χρειάζεται η εφαρμογή Android (Tauri mobile).
[lib]
name = "iot_guardian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
