# Φτιάχνει την εφαρμογή Android (Tauri / Rust) ως .apk και τη βάζει στο ίδιο Release με τις εκδόσεις υπολογιστή.
# Ξεκινά όταν ανέβει tag της μορφής v1.2.3, ή με το χέρι από την καρτέλα Actions (τότε το .apk μένει ως artifact).
# Υπογραφή: με το μόνιμο κλειδί από τα secrets ANDROID_KEYSTORE (PKCS12, base64) και ANDROID_KEYSTORE_PASSWORD.
# Αν δεν υπάρχουν, υπογράφει με προσωρινό κλειδί: το .apk εγκαθίσταται, αλλά η επόμενη έκδοση θέλει απεγκατάσταση πρώτα.
name: Android app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: 27.0.12077973
  BUILD_TOOLS: 34.0.0

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 'Android SDK: NDK, build-tools, platform'
        run: sdkmanager --install "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS}" "platforms;android-34"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: Έργο Android και εικονίδια
        working-directory: desktop
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android init --ci
          npx tauri icon app-icon.png

      - name: Build .apk (arm64 + armv7)
        working-directory: desktop
        env:
          CARGO_NET_RETRY: '5'
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --apk --target aarch64 --target armv7

      - name: Υπογραφή
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          APK=$(find desktop/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "apk: $APK"
          VER=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          OUT="IoT-Guardian_${VER}_android.apk"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          else
            echo "::warning::Δεν βρέθηκε μόνιμο κλειδί (ANDROID_KEYSTORE): υπογραφή με προσωρινό κλειδί."
            KS_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks.p12" -storetype PKCS12 -storepass "$KS_PASS" -alias iotguardian \
              -keyalg RSA -keysize 4096 -validity 10950 -dname "CN=IoT Guardian, O=Gyuri1999"
          fi
          export KS_PASS
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.p12" --ks-type PKCS12 --ks-pass env:KS_PASS --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          rm -f "$RUNNER_TEMP/ks.p12"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_OUT }}

      - name: Στο Release (μόνο για tag)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # το Release (πρόχειρο) το φτιάχνει το workflow «Desktop app»· περίμενε να υπάρξει
          for i in $(seq 1 40); do
            ID=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
            [ -n "$ID" ] && break
            sleep 15
          done
          [ -n "$ID" ] || { echo "δεν βρέθηκε Release για $TAG"; exit 1; }
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK_OUT" "https://uploads.github.com/repos/${{ github.repository }}/releases/$ID/assets?name=$APK_OUT" > /dev/null
          echo "ανέβηκε: $APK_OUT"
